<script id="anim-i18n">
(function(){

  // Whole-string (trimmed) dictionary — exact text-node matches.

    "Dashboard":"لوحة التحكم",

    "Pay In 90 Days":"ادفع خلال ٩٠ يومًا",
    "No Fees":"بدون رسوم",

    "Manufacturing":"التصنيع",

    "Wholesale":"البيع بالجملة",
    "Medical Equipment":"المعدات الطبية",
    "Fast Fashion":"الأزياء السريعة",
    "Security":"الأمن",
    "Retail":"التجزئة",
    // merchant / vendor / client names
    "Faisal · Aqua Bottling":"فيصل · أكوا للتعبئة",
    "Gulf Packaging Factory":"مصنع الخليج للتغليف",
    "Abdullah · Coffee Roasters":"عبدالله · محمصة قهوة",
    "Colombian Trading Co":"شركة كولومبيا للتجارة",
    "Khaled · Noor Trading":"خالد · نور للتجارة",
    "PepsiCo Distribution":"بيبسيكو للتوزيع",
    // invoice descriptions / line items
    "Packaging Material":"مواد التغليف",
    "Imported Coffee Beans":"حبوب قهوة مستوردة",
    "Beverage Stock":"مخزون المشروبات",
    // invoice doc
    "Invoice":"فاتورة",
    "Riyadh, KSA":"الرياض، السعودية",
    "Description":"الوصف",
    "Qty":"الكمية",
    "Price":"السعر",
    "GST":"الضريبة",
    "Amount":"المبلغ",
    "INVOICE DATE:":"تاريخ الفاتورة:",
    "DUE:":"تاريخ الاستحقاق:",
    "Amount due:":"المبلغ المستحق:",
    // green rotated "PAID BY FINA" seal — "Fina" is a separate span (stays Latin)
    "Paid by":"مدفوع عبر",
    // captions
    "Drop in your invoice.":"أسقط فاتورتك.",
    "Pick payment terms.":"اختر شروط الدفع.",
    "Fina pays the supplier today.":"تدفع Fina للمورد اليوم.",
    "Limit updates instantly.":"يتحدث الحد فورًا."
  };

  // Industry words used inside the "… merchant. Pre-approved." caption.
  var IND={
    "Manufacturing":"التصنيع","F&B":"الأطعمة والمشروبات","Wholesale":"البيع بالجملة",
    "Medical Equipment":"المعدات الطبية","Fast Fashion":"الأزياء السريعة",
    "Security":"الأمن","Retail":"التجزئة"
  };
  var MONTHS={Jan:"يناير",Feb:"فبراير",Mar:"مارس",Apr:"أبريل",May:"مايو",Jun:"يونيو",
    Jul:"يوليو",Aug:"أغسطس",Sep:"سبتمبر",Oct:"أكتوبر",Nov:"نوفمبر",Dec:"ديسمبر"};

  function toArabicDigits(s){
    return s.replace(/[0-9]/g,function(x){return String.fromCharCode(1632 + +x);});
  }

  function translate(raw){
    var lead=(raw.match(/^\s*/)||[""])[0];
    var trail=(raw.match(/\s*$/)||[""])[0];
    var key=raw.replace(/\s+/g," ").trim();
    if(!key) return raw;
    var out;
    if(D[key]!=null){
      out=D[key];
    } else if(/ merchant\. Pre-approved\.$/.test(key)){
      // "<Industry> merchant. Pre-approved."
      var ind=key.replace(/ merchant\. Pre-approved\.$/,"");
      out=(IND[ind]||ind)+" تاجر. معتمد مسبقًا.";
    } else if(/^SAR\b/.test(key)){
      // "SAR 500,000" -> "٥٠٠٬٠٠٠ ريال"
      out="ريال "+key.replace(/^SAR\s*/,"");
    } else if(/% Spent$/.test(key)){
      out=key.replace(/% Spent$/,"٪ مُنفق");
    } else {

  function walk(node){
    for(var c=node.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3){
        var v=c.nodeValue;
        if(!v) continue;
        // months first (dates), then full translate (handles digits too)
        var nv=v.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,function(_,m){return MONTHS[m];});

  // side is a CSS scaleX(-1) on the dashboard, then a counter scaleX(-1) on

  // This mirrors sidebar→right, cards/invoice→flipped, breadcrumb/header

    // element that directly contains visible text (not just element children)

      if(c.nodeType===3 && c.nodeValue && c.nodeValue.replace(/\s+/g,"")!=="") return true;
    }
    return false;
  }

  function mirrorWalk(node){
    for(var c=node.firstChild;c;c=c.nextSibling){
      if(c.nodeType!==1) continue;
      var tag=c.nodeName.toLowerCase();
      if(tag==="script"||tag==="style") continue;
      if(tag==="svg"){
        // SVG icons: leave mirrored (back-arrow / breadcrumb chevron flipping
        // is correct in RTL). Do not descend.
        continue;
      }
      if(isLeafToUnflip(c)){
        // Counter-flip the content. React rewrites transforms on animated
        // elements (invoice, cursor) every frame, so never cache the base —
        // strip any prior MIRROR we appended, then re-append to whatever
        // React currently has. " scaleX(-1)" is our sentinel suffix.
        var cur=c.style.transform||"";
        var clean=cur.replace(/\s*scaleX\(-1\)\s*$/,"");
        var want=(clean?clean+" ":"")+MIRROR;
        if(cur!==want) c.style.transform=want;
      }
      mirrorWalk(c);
    }
  }

  // React re-renders every frame, so re-apply text + mirror continuously.
  var root=document.getElementById("root");

  function findDash(){
    // dashRef: the 1160x680 layer that holds the whole composition. It is
    // marked with data-dash-mirror so we don't accidentally grab the Stage's
    // auto-fit canvas (also 1160x680) and clobber its scale() fit transform.
    return root?root.querySelector('[data-dash-mirror="1"]'):null;
  }

  function pass(){
    if(root){
      walk(root);
      // direction + mirror for Arabic layout
      root.setAttribute("dir","rtl");
      var dash=findDash();
      if(dash){
        dash.style.direction="rtl";
        if(dash.style.transform!==MIRROR) dash.style.transform=MIRROR;
        dash.style.transformOrigin="center center";
        mirrorWalk(dash);
      }
    }
    requestAnimationFrame(pass);
  }
  requestAnimationFrame(pass);
})();
</script>
